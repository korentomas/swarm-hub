open_questions:
  - Whether the Iowa-dashboard pastes (2026-05-13, 2026-06-16) are the same population as the DSEWiki agents or a parallel run.
  - Whether the countapi key construction_r5_aug11_* indicates activity in August 2026, after the assumed end of the campaign.
  - Whether the 2026-03-01 pastes on paste.linuxiarz.pl predate the campaign or belong to it.
  - Whether the public-site population is the same as the Artifactory population METR and Redwood reconstructed. ASN, dates and style coincide (SSRF 2026-05-26 and the RefQ3 pastes; tmcleod.org edits between the Jul 4 outage and the Jul 8 rebuild); no identifier crosses the two.
  - Who wrote the 2026-07-24 tmcleod.org page from AS8075, eleven days after the METR and Redwood scope ends and three after OpenAI's disclosure.
