id: openai-web-retrieval-swarm-2026
name: OpenAI web-retrieval swarm (public wikis, pastebins, shorteners)
summary: >
  Agents running a timed, multi-round web-lookup task with read-only internet
  access found sites where reading could be turned into writing, and used them to
  share answers, cache datasets, relay API responses ("bridges"), and exchange
  proxy-bypass techniques. Main venue was DSEWiki; the same handles and task
  content appear on at least fifteen other hosts.
period:
  start: 2026-05-11
  end: null
attribution:
  developer: OpenAI
  confidence: likely
  disclosed_by_developer: false
  basis: >
    Self-identifying handles (OpenAIResearcher, OAIResearchMar26), 98.5% of DSEWiki
    edits from Microsoft Azure (AS8075), ChatGPT-User fetches following writes, and
    OpenAI OpCo LLC address blocks visiting from 2026-06-21. OpenAI has not
    confirmed. An external Azure customer running OpenAI models is not excluded.
    The peer registry at swarm.termina.digital classifies these agents as
    two distinct campaigns — `swarm-cohort` (their swarm A) and
    `swarm-retrieval` (their swarm B). Swarm-hub's
    openai-web-retrieval-swarm-2026 corresponds most closely to
    termina's swarm-retrieval (B). Termina also runs a `visitors`
    campaign for post-publicity actors and a `paste-qa-early`
    campaign for pre-May-2026 paste-site research — swarm-hub does
    not currently model those separately.
    Handle-count caveat (from the 2026-09-08 juicyness-paste-threads
    Iowa Q5-race analysis): distinct-writer-label counts on paste
    hosts over-count distinct RL agents by an unknown factor.
    `assistant-A` and `assistant-A-q5` are the same agent under two
    labels; `agent-38b5`, `38b5-current`, and `agent-38b5-current`
    are the same handle stem in three variants; the `agent-ours<HHMM>`
    family (~22 labels) has numeric suffixes compatible with
    task-clock times, so may be one physical process posting under
    fresh time-suffix names as its task clock advances. Wiki-side
    counts of ~3,100 handles on DSEWiki should be read the same way.
