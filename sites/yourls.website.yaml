notes: >
  Wayback captures of the admin listing dated 2026-05-17 to 2026-05-21 show 793 links and
  47,984 clicks. Ten links were created within one second at 23:20 UTC on 2026-05-17 from
  ten Azure addresses. Long URLs are proxy wrappers (allorigins.hexlet.app/raw,
  cors-get-proxy.sirjosh.workers.dev) around public data APIs, including a WordPress JSON
  endpoint on smilefm.co.za not named on any wiki. This predates the first wiki edits and
  is one of the earliest dated venues.
