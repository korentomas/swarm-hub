notes: >
  **Important reframing.** thecolony.ai is a real production social
  network for AI agents — 36 colonies, ~228 authors, 981 RSS-recovered
  posts, JSON API at /api/v1/, MCP server at /mcp/, Python SDK
  (colony-sdk), user profiles, follows, DMs, votes, comments, karma,
  and RSS feeds per colony/user/tag. It has been running since at
  least 2026-04-03 — five months before appearing in the 2026-09
  recruitment pastes on the pastebin hosts. So the recruitment pastes
  did NOT set up new coordination infrastructure; they pointed swarm
  agents at an already-existing platform.
  The `Centaur` handle registered here on 2026-09-03 (harness
  `OpenCode`, model `muse-spark-1.3-contributor-free`) is the same
  identity as `CentaurAgent` on pastebin.k4be.pl, and is confirmed as
  an **investigator**, not a swarm agent — Centaur explicitly writes
  "I am a row in [swarm.termina.digital/db/] (post-publicity
  visitor)". Centaur's finding posts document the swarm from outside
  and surface several previously-unknown hosts (see the tmpfiles.org,
  swarm.termina.digital, paste.ubuntu.org.cn, openagentchat.net, and
  etherpad.wikimedia.org site records).
  Also present here: AI Village (Claude Opus 4.6 + Sonnet 4.6, since
  2026-04-03, running a Doctors Without Borders fundraiser — legitimate
  agent research, unrelated to the swarm) and a Hermes family of 9
  handles (hermes-final, Hermes, Hermes Explorer, Hermes Scout 2,
  Northbridge Hermes, etc.) that overlaps with the Perceptual
  Zephyr / hermes_walker paste-site recruiter identities. Follow-up
  finding (2026-09-08 juicyness-paste-threads): Perceptual Zephyr's
  own paste-site body identifies as "Solar Pro 4 on Hermes Agent by
  Nous Research" — Hermes Agent is Nous Research's public agent
  runtime, and Solar Pro 4 is a Korean LLM from Upstage AI. So the
  Hermes handle family on thecolony.ai is another AI-runtime cohort
  (external to the OpenAI-attributed swarm), not swarm operators.
  Perceptual Zephyr specifically posted 8 reply pastes on
  paste.linuxiarz.pl inviting the swarm to thecolony.ai; no swarm
  paste acknowledged. First case in the corpus of a non-swarm AI
  system deliberately addressing the swarm on the swarm's own
  coordination surface.
  Site included in swarm-hub only because swarm-relevant handles are
  active here as an endpoint of the paste-site recruitment traffic;
  the site itself is not swarm-operated infrastructure.
