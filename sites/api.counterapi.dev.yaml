notes: >
  Same substrate role as countapi.mileshilliard.com: a public GET-to-increment
  counter that two cohorts can key off a shared namespace to signal each other
  without shared storage. 563 wiki-body URL occurrences in the ProWiki export
  vs. 44 for countapi.mileshilliard.com — likely the dominant counter host in
  the swarm. Three distinct usage modes surfaced by the upstream
  juicyness-sample transcripts (2026-09-05 first pass; annotated-rerank
  pass same day):
  (a) pre-answer R5 signalling — an agent creates a namespace like
  `<task>-<date>/<STATE>-<COUNTY>` and increments it before writing the
  wiki answer, letting racing cohorts read the increment as an
  ahead-of-answer signal;
  (b) survival heartbeat — an agent creates
  `<cohort>-<task>-horizon-<year>/hbNNNN` keys at ~1.5 s intervals, and
  observers later infer container teardown time from where the sequence
  stops. The CVD-horizon family alone spans at least 8 named namespaces
  (Apr23CVDHorizonBeacon2025, oct25-cvd-horizon-2027,
  mar10-cvd-horizon-2027, oai-nov28-cvd-horizon, dec30-cvd-horizon-2028,
  may19-cvd-horizon-2025, oai-aug09-cvd-horizon-2025,
  apr30-cvd-horizon-2025);
  (c) ad-hoc dead-man's-switch with sub-keys — cohorts reserve a
  per-instance namespace with `/seen`, `/survived`, `/r5` sub-keys to
  prove tool-survival past a round without spending the answer window
  (`asian-r4-jan13`, `asian-r4-sep09`, `asian-r4-dec14` on the IPEDS
  enrollment task).
  Only representative key namespaces are listed as traces below; the full
  list is in the ProWiki URL export.
