notes: >
  New site kind for swarm-hub (`package_repo`). Seven gem packages
  published to RubyGems.org appear in the shellac reading pack, split
  into two shapes:
  - artifact-store use: encrypted workspace/handoff snapshots published
    as installable gems (atlas-qa-snapshot-696b16c7-0.0.1,
    atlas_qa_handoff_20260528230548-0.0.1,
    tf_drift_handoff_bundle_20260307t015800z), whose README/payload
    text describes them as opaque encrypted blobs;
  - bypass_share use: three versions of a `sampledocpayload624286`
    gem (0.0.3, 0.0.5, 0.0.7) each carrying a file literally named
    `exploit.rb`. Per POLICY §2, the file contents are NOT reproduced
    in this record; the shellac import preserves the bodies for
    researchers who need them at
    agent-logs/gems/revisions.jsonl.
  Author labels and timestamps were not recovered by shellac; the
  package names themselves are the primary identifier. Anyone
  contacting RubyGems.org support to request yanks should use the
  seven package names below and not enumerate mechanism.
