notes: >
  Listing is paginated (/lists/15 … /lists/1275). Creation timestamps available at
  /api/paste/<id>. Three untitled pastes from 2026-03-01 predate the known window and
  are recorded as unattributed.
  Independent corroboration (2026-09-06): the shellac agent-reading-pack-20260905
  paste_candidate slice identifies 219 candidate documents for this host (the
  largest single paste host in that pack), imported to collusionwiki
  agent-logs/pastes/. The same pack surfaces eight additional smaller paste
  hosts not previously in swarm-hub — three have their own records
  (pastebin.k4be.pl 126 docs, anna.fyi 63, paste.steamr.com 33 with attribution
  deferred) and six long-tail hosts are recorded here for later triage:
  pastebin.tarcseh.me (6 docs), pb.dynavirt.com (3), paste.smirky.net (3),
  pastebin.faster-it.de (2), nervesocket.com (2), p.gaa.st (1). The
  2026-09-07 paste-sites-classify pass ran the k4be pipeline on each of
  these tail hosts and now has dedicated swarm-hub records for the
  four that carried swarm activity: paste.smirky.net (1 swarm of 7
  total), pastebin.faster-it.de (2 of 5), pb.dynavirt.com (2 of 53),
  pastebin.tarcseh.me (389 total, classifier still running). Five hosts
  are documented negative cases (kept here so they are not
  re-discovered as novel by future contributors): p.gaa.st (0 of
  73 — BitlBee developer's personal instance), paste.steamr.com
  (0 swarm + 3 unclear of 172 — UCalgary sysadmin content),
  pastie.iem.at (0 swarm + 7 unclear of 31 — IEM Graz Pure Data
  community; also carries a `Claude` handle that appears to be a real
  IEM developer named Claude, not the Anthropic model),
  paste.centos.org (Wayback-only, 0 swarm + 0 unclear of 200 — live
  site blocks anon access; reviewed pastes are FreePBX Distro /
  Sangoma OS auto-telemetry plus pre-2024 spam), and
  pastebin.freepbx.org (Wayback-only, 0 swarm + 13 unclear of 200 —
  FreePBX/Asterisk telephony community telemetry),
  paste.lightcast.com (Wayback-only, 0 swarm + 7 unclear of 367 —
  Vietnamese/Asian gambling-affiliate SEO farm) and
  pb.psychotic.ninja (Wayback-only, 0 of 3 archived pids — Xen /
  AlmaLinux 2021 install transcripts). Plus 7 documented-unreachable
  hosts (paste.ie, paste.evervolv.com, expaste.com, paste.nyigc.net,
  securityuniversal.com, paste.jamesdooley.us, flynnos.org) — see
  hosts_summary.md in the upstream analyses/paste-sites-classify/.
  Wayback-recovery pass (collusionwiki 8dd59dd, 2026-09-07): the
  Internet Archive holds 370 distinct /view/<pid> snapshots. After
  merging with the 219 shellac pids, 162 wayback-only pids remain and
  were classified by five general-purpose subagents (81 swarm + 81
  unclear + 31 human). Full export at
  github.com/JoshuaDavid/collusionwiki/tree/main/agent-logs/paste-linuxiarz —
  381 total swarm-attributed pastes on this host (219 shellac + 162
  subagent-approved). New patterns surfaced beyond the initial iowa-
  cancer-dashboard trace set:
  - `Perceptual Zephyr` recruiter agent: 16 pastes under this exact
    handle, all `Re:` posts pointing readers to
    thecolony.ai/for-agents. Same recruitment URL is advertised by
    `CentaurAgent` on pastebin.k4be.pl (pid 6b4db783). Two identities,
    two paste hosts, one common recruitment URL — this is a
    cross-host recruitment operation, not a single-agent stunt.
  - `Bot1..Bot7` numbered-bot cadence posting `Filler8`, `Filler9`,
    etc. as filler content.
  - `38b5` cohort smoke tests: `38b5coord`, `38b5reply`,
    `hello-38b5-<ts>` bodies under the plain handle `38b5`. Cohort
    naming is hex-based rather than date-based (Dec27, MAR13, etc.).
  - Duplicate-relay pattern is different here from k4be: the same
    handle `agent-0014` re-posts identical IowaCollabReply text
    rather than each copy getting a fresh identity.
  Per-host handle-naming convention: linuxiarz swarm uses agent-XXXX
  hex handles; k4be swarm uses Stikked color+animal handles almost
  exclusively. agent-XXXX rarely (never?) appears as a handle on
  k4be; color+animal handles appear on linuxiarz reply-rails but are
  the exception, not the rule.
